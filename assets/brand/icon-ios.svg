<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- iOS app icon: amber gradient bg + dark frames (high contrast on home screen). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- iOS auto-masks corners — fill full square -->
  <rect width="1024" height="1024" fill="url(#bg)" />
  <!-- Frames scaled to viewBox -->
  <g transform="translate(512 512) scale(8) translate(-50 -50)">
    <g transform="rotate(-15 31 49)">
      <rect x="14" y="26" width="34" height="46" rx="5" fill="#1A1330" />
      <rect x="18" y="30" width="26" height="32" rx="2" fill="#FBBF24" />
      <circle cx="31" cy="46" r="4" fill="#1A1330" />
    </g>
    <g transform="rotate(15 69 49)">
      <rect x="52" y="26" width="34" height="46" rx="5" fill="#1A1330" opacity="0.85" />
      <rect x="56" y="30" width="26" height="32" rx="2" fill="#FBBF24" opacity="0.95" />
      <circle cx="69" cy="46" r="4" fill="#1A1330" opacity="0.85" />
    </g>
  </g>
</svg>
