<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- iOS app icon — Pixel Wing (Concept B3): butterfly assembled from photo pixels. -->
  <!-- Background -->
  <rect width="1024" height="1024" fill="#193153" />

  <!-- Left wing (violet #A78BFA) -->
  <rect x="180" y="280" width="180" height="180" fill="#A78BFA" />
  <rect x="360" y="370" width="130" height="130" fill="#A78BFA" opacity="0.7" />
  <rect x="180" y="540" width="180" height="180" fill="#A78BFA" opacity="0.85" />
  <rect x="360" y="510" width="130" height="130" fill="#A78BFA" opacity="0.6" />

  <!-- Right wing (amber #FBBF24) -->
  <rect x="664" y="280" width="180" height="180" fill="#FBBF24" />
  <rect x="534" y="370" width="130" height="130" fill="#FBBF24" opacity="0.8" />
  <rect x="664" y="540" width="180" height="180" fill="#FBBF24" opacity="0.9" />
  <rect x="534" y="510" width="130" height="130" fill="#FBBF24" opacity="0.7" />

  <!-- Body (white) -->
  <rect x="490" y="350" width="44" height="320" rx="20" fill="#F8FAFC" />
</svg>
