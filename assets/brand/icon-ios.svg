<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- iOS app icon — solid amber bg, dark frames with amber photo cutouts, centered. -->
  <rect width="1024" height="1024" fill="#FBBF24" />

  <!-- Left frame (rotated -15° around (335, 512)) -->
  <g transform="rotate(-15 335 512)">
    <rect x="160" y="240" width="350" height="544" rx="48" fill="#0B0F14" />
    <rect x="200" y="280" width="270" height="380" rx="20" fill="#FBBF24" />
    <circle cx="335" cy="470" r="42" fill="#0B0F14" />
  </g>

  <!-- Right frame (rotated +15° around (689, 512)) -->
  <g transform="rotate(15 689 512)">
    <rect x="514" y="240" width="350" height="544" rx="48" fill="#0B0F14" opacity="0.92" />
    <rect x="554" y="280" width="270" height="380" rx="20" fill="#FBBF24" opacity="0.95" />
    <circle cx="689" cy="470" r="42" fill="#0B0F14" opacity="0.92" />
  </g>
</svg>
