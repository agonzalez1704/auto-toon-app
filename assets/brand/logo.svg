<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- B6.2 Framed Wings — main logo (transparent bg). Use anywhere over dark or light. -->
  <!-- Left frame (amber) -->
  <g transform="rotate(-15 31 49)">
    <rect x="14" y="26" width="34" height="46" rx="5" fill="#FBBF24" />
    <rect x="18" y="30" width="26" height="32" rx="2" fill="#0B0F14" />
    <circle cx="31" cy="46" r="4" fill="#FBBF24" />
  </g>
  <!-- Right frame (violet) -->
  <g transform="rotate(15 69 49)">
    <rect x="52" y="26" width="34" height="46" rx="5" fill="#A78BFA" />
    <rect x="56" y="30" width="26" height="32" rx="2" fill="#0B0F14" />
    <circle cx="69" cy="46" r="4" fill="#A78BFA" />
  </g>
</svg>
