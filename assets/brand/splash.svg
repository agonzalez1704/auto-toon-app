<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Splash — Pixel Wing on dark navy. Slightly smaller for breathing room. -->
  <rect width="1024" height="1024" fill="#0B0F14" />

  <!-- Left wing (violet) -->
  <rect x="300" y="380" width="120" height="120" fill="#A78BFA" />
  <rect x="420" y="440" width="86" height="86" fill="#A78BFA" opacity="0.7" />
  <rect x="300" y="560" width="120" height="120" fill="#A78BFA" opacity="0.85" />
  <rect x="420" y="540" width="86" height="86" fill="#A78BFA" opacity="0.6" />

  <!-- Right wing (amber) -->
  <rect x="604" y="380" width="120" height="120" fill="#FBBF24" />
  <rect x="518" y="440" width="86" height="86" fill="#FBBF24" opacity="0.8" />
  <rect x="604" y="560" width="120" height="120" fill="#FBBF24" opacity="0.9" />
  <rect x="518" y="540" width="86" height="86" fill="#FBBF24" opacity="0.7" />

  <!-- Body -->
  <rect x="500" y="420" width="24" height="220" rx="12" fill="#F8FAFC" />
</svg>
